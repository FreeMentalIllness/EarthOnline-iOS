name: EarthOnline

options:
  bundleIdPrefix: com.example.earthonline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  transitivelyLinkDependencies: false
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: 1.0.5
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1,2
    ENABLE_PREVIEWS: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  EarthOnline:
    type: application
    platform: iOS
    productName: EarthOnline
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/Activities
      - path: Sources/Intents
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/Entitlements/EarthOnline.entitlements
    configFiles:
      Debug: xcconfig/Debug.xcconfig
      Release: xcconfig/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.earthonline
        PRODUCT_NAME: EarthOnline
        # 显式指定，避免 Xcode 走自动生成 Info.plist 的分支（会导致版本号/自定义 key 丢失）
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.5
        CURRENT_PROJECT_VERSION: 2
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies:
      - target: EarthOnlineWidgets
        embed: true

  EarthOnlineWidgets:
    type: app-extension
    platform: iOS
    productName: EarthOnlineWidgets
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
      - path: Sources/Activities
    info:
      path: Resources/WidgetInfo.plist
    entitlements:
      path: Resources/Entitlements/EarthOnlineWidget.entitlements
    configFiles:
      Debug: xcconfig/Debug.xcconfig
      Release: xcconfig/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.earthonline.EarthOnlineWidgets
        PRODUCT_NAME: EarthOnlineWidgets
        INFOPLIST_FILE: Resources/WidgetInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.5
        CURRENT_PROJECT_VERSION: 2
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies: []
