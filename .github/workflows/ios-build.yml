name: iOS 未签名 ipa 构建

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 构建变体
        type: choice
        options:
          - full
          - nowidget
        default: full
      upload_artifact:
        description: 是否上传产物
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "xcconfig/**"
      - "Scripts/**"
      - "project.yml"
      - "project.nowidget.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "xcconfig/**"
      - "Scripts/**"
      - "project.yml"
      - "project.nowidget.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 EarthOnline (unsigned ipa)
    runs-on: macos-15
    timeout-minutes: 45

    env:
      VARIANT: ${{ github.event.inputs.variant || 'full' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 缓存 Homebrew 依赖
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}-v1
          restore-keys: brew-xcodegen-

      - name: 安装 xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 注入本地密钥（可选）
        run: |
          if [ -n "${{ secrets.AMAP_KEY }}" ]; then
            printf 'AMAP_KEY = %s\n' "${{ secrets.AMAP_KEY }}" > xcconfig/Secrets.local.xcconfig
            echo "已注入 AMapKey"
          else
            echo "未提供 AMAP_KEY，使用系统 MapKit 默认后端"
          fi

      - name: 选择构建变体
        id: spec
        run: |
          if [ "${VARIANT}" = "nowidget" ]; then
            echo "spec=project.nowidget.yml" >> "$GITHUB_OUTPUT"
            echo "artifact=EarthOnline-iOS-nowidget" >> "$GITHUB_OUTPUT"
          else
            echo "spec=project.yml" >> "$GITHUB_OUTPUT"
            echo "artifact=EarthOnline-iOS-full" >> "$GITHUB_OUTPUT"
          fi

      - name: 打印关键构建设置
        run: |
          echo "== 工程文件内的版本/Info.plist 设置 =="
          grep -nE "INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|MARKETING_VERSION|CURRENT_PROJECT_VERSION" \
            EarthOnline.xcodeproj/project.pbxproj || echo "(未匹配到任何设置)"
          echo "== EarthOnline 目标的 buildConfigurationList 片段 =="
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" EarthOnline.xcodeproj/project.pbxproj | head -5

      - name: 构建未签名 ipa
        run: |
          chmod +x Scripts/build_unsigned_ipa.sh Scripts/verify_ipa.sh
          bash Scripts/build_unsigned_ipa.sh "${{ steps.spec.outputs.spec }}"

      - name: 列出产物
        id: artifact-path
        run: |
          IPA=$(ls -1 EarthOnline-iOS-*-unsigned.ipa | head -n 1)
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$IPA")" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: 校验 Entitlements
        run: bash Scripts/verify_ipa.sh "${{ steps.artifact-path.outputs.path }}"

      - name: 上传产物
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.spec.outputs.artifact }}
          path: ${{ steps.artifact-path.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: 汇总
        run: |
          {
            echo "### iOS 构建完成 ✅"
            echo ""
            echo "- 变体：${VARIANT}"
            echo "- 产物：${{ steps.artifact-path.outputs.name }}"
            echo "- 说明：未签名 ipa，需用 SideStore / AltStore 自签名安装"
          } >> "$GITHUB_STEP_SUMMARY"
