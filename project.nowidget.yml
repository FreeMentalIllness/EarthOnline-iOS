# 无 Extension 变体：仅主 App 目标，用于 SideStore 因 App ID / 扩展名额受限导致安装失败时的兜底构建。
# 生成：xcodegen generate --spec project.nowidget.yml
# 代价：桌面小组件与灵动岛不可用（数据页/任务/地图等主功能不受影响）。

name: EarthOnline

options:
  bundleIdPrefix: com.example.earthonline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  transitivelyLinkDependencies: false
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: 1.0.4
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1,2
    ENABLE_PREVIEWS: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  EarthOnline:
    type: application
    platform: iOS
    productName: EarthOnline
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/Activities
      - path: Sources/Intents
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/Entitlements/EarthOnline.entitlements
    configFiles:
      Debug: xcconfig/Debug.xcconfig
      Release: xcconfig/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.earthonline
        PRODUCT_NAME: EarthOnline
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.4
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    dependencies: []
